services:
  # ─── Backend (API Express) ───────────────────────────────────────────────────
  - type: web
    name: upspot-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false          # ingrésalo manualmente en Render → tu cadena de MongoDB Atlas
      - key: FRONTEND_URL
        sync: false          # ingrésalo manualmente: https://upspot-frontend.onrender.com

  # ─── Frontend (Angular SSR) ──────────────────────────────────────────────────
  - type: web
    name: upspot-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/pagina-maye/server/server.mjs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: API_PROXY_TARGET
        fromService:
          type: web
          name: upspot-backend
          property: host
